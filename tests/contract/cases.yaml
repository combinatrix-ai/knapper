# The knapper command-line contract, as data. See README.md.
#
# These describe what a caller can rely on. They are deliberately independent
# of how any one implementation is arranged, so a port can be checked against
# them rather than hoped about.

# ---------------------------------------------------------------- Obsidian --

- name: obsidian / links resolve, code and comments do not
  vault: obsidian
  args: [broken-links, --format, json]
  # Thesis.md holds [[Not A Link]] in a fence, [[Also Not A Link]] in a
  # %%comment%% and [[Nor This]] in an inline span. None is a reference.
  expect:
    json: []

- name: obsidian / an alias resolves to the note declaring it
  vault: obsidian
  args: [backlinks, Notes/Lit Review.md, --format, json]
  # Thesis.md links by name, by heading, as an embed, and by the alias
  # 文献レビュー. All four land on the same note.
  expect:
    json_at: {"0.source": "Projects/Thesis.md"}

- name: obsidian / a link-valued property reaches the graph
  vault: obsidian
  args: [query, --where, inlinks>0, --format, paths]
  sorted: true
  expect:
    lines: ["Notes/Lit Review.md", "Projects/Thesis.md"]

- name: obsidian / tags include nested and non-ASCII, and exclude code
  vault: obsidian
  args: [tags, --format, json]
  expect:
    stdout_contains: ["project/active", "日本語タグ", "research"]
    stdout_excludes: ["notatag"]

- name: obsidian / the full emoji task set is read
  vault: obsidian
  args: [tasks, --all, --format, json]
  # Four in Thesis.md plus one in the daily note.
  expect:
    json_length: 5
    stdout_contains:
      - '"due_date": "2026-08-01"'
      - '"done_date": "2026-07-20"'
      - '"scheduled_date": "2026-08-05"'
      - '"start_date": "2026-08-02"'
      - '"priority": "high"'

- name: obsidian / overdue filters on the due date
  vault: obsidian
  args: [tasks, --due-to, "2026-08-01", --format, json]
  # The daily note's task is due earlier, so it is inside the range too.
  expect:
    json_length: 2
    stdout_contains: ['"due_date": "2026-08-01"', '"due_date": "2026-07-29"']

- name: obsidian / an unparseable date is rejected, not ignored
  vault: obsidian
  args: [tasks, --due-from, today]
  expect:
    exit: 2
    stderr_contains: ["--due-from", "YYYY-MM-DD"]

- name: obsidian / context aggregates one note
  vault: obsidian
  args: [context, Notes/Lit Review.md, --format, json]
  expect:
    json_at:
      path: "Notes/Lit Review.md"
      title: "Lit Review"

- name: obsidian / focused context defaults to three lines and a document map
  vault: obsidian
  args: [context, Notes/Lit Review.md, --line, "9", --format, json]
  expect:
    json_at:
      kind: note
      "document.outline_depth": 1
      "document.current_branch_index": 0
      "document.entries.0.index": 0
      "document.entries.0.title": Method
      "document.entries.0.current": true
      "focus.line": 9
      "focus.heading_path.0": Lit Review
      "focus.heading_path.1": Method
      "excerpt.start_line": 6
      "excerpt.end_line": 11

- name: obsidian / focused context can omit content but keeps metadata
  vault: obsidian
  args: [context, Notes/Lit Review.md, --line, "9", --no-content, --format, json]
  expect:
    stdout_excludes: ['"content"']
    stdout_contains: ['"enclosing_section"', '"start_line": 6']

- name: obsidian / focused context rejects an invalid physical line
  vault: obsidian
  args: [context, Notes/Lit Review.md, --line, "99"]
  expect:
    exit: 1
    stderr_contains: ["Invalid --line 99", "between 1 and 11"]

- name: obsidian / section and explicit windows are unambiguous
  vault: obsidian
  args: [context, Notes/Lit Review.md, --line, "9", --section, -A, "1"]
  expect:
    exit: 1
    stderr_contains: ["cannot be combined"]

- name: obsidian / references keep their position and are never resolved
  vault: obsidian
  args: [refs, Projects/Thesis.md, --format, json]
  # Thesis.md holds three real references, plus one in an inline span, one in
  # a %%comment%%, one in a fence, a bare URI, an autolink, and five
  # destinations that are not the grammar.
  expect:
    json_length: 3
    json_at:
      "0.path": "Projects/Thesis.md"
      "0.uri": "knapper://personal/address.nihonbashi_kobunacho"
      "0.provider": "personal"
      "0.locator": "address.nihonbashi_kobunacho"
      "0.label": "日本橋小舟町の住所"
      "0.line": 29
      "0.column": 17
    stdout_excludes:
      - "not-inline"
      - "not-comment"
      - "not-fenced"
      - "not-bare"
      - "not-autolink"
      - "Personal/upper"
      - "a//b"
      - "../etc"
      - "a%2Fb"
      - "has space"

- name: obsidian / references filter by provider
  vault: obsidian
  args: [refs, --provider, work, --format, json]
  expect:
    json_length: 2
    json_at:
      "0.uri": "knapper://work/tokens/ci.deploy"
      "1.uri": "knapper://work/db/prod"

- name: obsidian / reference paths are unique and pipeable
  vault: obsidian
  args: [refs, --format, paths]
  expect:
    lines: ["Projects/Thesis.md"]

- name: obsidian / an unusable provider name is a usage error
  vault: obsidian
  args: [refs, --provider, "Work"]
  expect:
    exit: 2
    stderr_contains: ["Invalid provider name"]

- name: obsidian / a reference is external and stays out of the link graph
  vault: obsidian
  args: [links, Projects/Thesis.md, --format, json]
  # knapper:// is a scheme, so the graph treats it the way it treats https:
  # -- as somewhere else. broken-links agrees, and says nothing about them.
  expect:
    stdout_excludes: ["knapper://"]

- name: obsidian / context reports the references in one note
  vault: obsidian
  args: [context, Projects/Thesis.md, --format, json]
  expect:
    json_at:
      "references.0.uri": "knapper://personal/address.nihonbashi_kobunacho"
      "references.0.provider": "personal"
      "references.0.locator": "address.nihonbashi_kobunacho"
      "references.0.line": 29
      "references.0.column": 17

- name: obsidian / frontmatter reads a property
  vault: obsidian
  args: [frontmatter, get, Projects/Thesis.md, status]
  expect:
    stdout_contains: ["open"]

- name: obsidian / knapper's own config is not a note
  vault: obsidian
  args: [query, --format, paths]
  expect:
    stdout_excludes: ["knapper.config.md"]

- name: obsidian / rename rewrites every inbound link
  vault: obsidian
  args: [rename, "Lit Review", "Reading Notes"]
  expect:
    file:
      "Projects/Thesis.md":
        contains: ["Reading Notes"]
        excludes: ["[[Notes/Lit Review]]"]

- name: obsidian / dry run changes nothing
  vault: obsidian
  args: [rename, "Lit Review", "Reading Notes", --dry-run]
  expect:
    stdout_contains: ["DRY RUN"]
    file:
      "Projects/Thesis.md":
        contains: ["[[Notes/Lit Review]]"]

# -------------------------------------------------------- Plain markdown --

- name: markdown-plain / markdown links resolve without any wikilinks
  vault: markdown-plain
  args: [links, README.md, --format, json]
  # guide is linked twice, once plain and once with an #anchor.
  expect:
    json_length: 3
    stdout_contains: ["docs/guide", "docs/my guide"]

- name: markdown-plain / images and external URLs are not links
  vault: markdown-plain
  args: [links, README.md, --format, json]
  expect:
    stdout_excludes: ["logo.png", "example.com"]

- name: markdown-plain / percent-encoded targets resolve
  vault: markdown-plain
  args: [backlinks, docs/my guide.md, --format, json]
  expect:
    json_at: {"0.source": "README.md"}

- name: markdown-plain / rename preserves link text and anchors
  vault: markdown-plain
  args: [rename, guide, handbook]
  expect:
    file:
      "README.md":
        contains: ["[guide](docs/handbook.md)", "[anchored](docs/handbook.md#setup)"]
        excludes: ["docs/guide.md"]

# ------------------------------------------------------------------ Foam --

- name: foam / both link syntaxes coexist
  vault: foam
  args: [links, index.md, --format, json]
  expect:
    json_length: 2
    stdout_contains: ["concepts/graph"]

- name: foam / the graph has no broken targets
  vault: foam
  args: [broken-links, --format, json]
  expect:
    json: []

# --------------------------------------------------------------- Dendron --

- name: dendron / dot-hierarchy names are not extensions
  vault: dendron
  args: [links, proj.knapper.md, --format, json]
  expect:
    json_length: 3
    stdout_contains: ["proj.knapper.design"]

- name: dendron / nothing is broken
  vault: dendron
  args: [broken-links, --format, json]
  expect:
    json: []

# ---------------------------------------------------------- Zettelkasten --

- name: zettelkasten / id-prefixed filenames link both ways
  vault: zettelkasten
  args: [query, --where, inlinks>0, --format, paths]
  sorted: true
  expect:
    lines:
      - "202607281530 block model.md"
      - "202607281545 file as unit.md"

# -------------------------------------------------------------- Dataview --

