- name: dataview / a wikilink in a field value is a real link
  vault: dataview
  args: [backlinks, Areas/Health/食事.md, --format, json]
  expect:
    json_at: {"0.source": "Diary/2026-05-06.md"}

- name: dataview / fields lists what the vault declares
