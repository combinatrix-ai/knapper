# ------------------------------------------------ Rewriting links safely --
# The command that earns the install, and the one with the most ways to be
# subtly wrong. Everything below is one file's worth of link forms.

- name: refactor / every link form to a renamed note is rewritten
  vault: refactor
  args: [rename, Target, Renamed]
  expect:
    file:
      "source.md":
        contains:
          - "[[Renamed]]"
          - "[[Renamed|the target]]"
          - "[[Renamed#Section]]"
          - "[the note](Renamed.md)"
          - "[Human label](Renamed.md#a-heading)"

- name: refactor / lookalikes are left alone
  vault: refactor
  args: [rename, Target, Renamed]
  expect:
    file:
      "source.md":
        contains:
          # An image embed is not an outgoing link, and .png is not the note.
          - "![Target](Target.png)"
          # The URL merely ends the same way.
          - "https://x.com/Target.md"
          # So does the reference, and knapper:// is somewhere else too: the
          # locator belongs to a provider, not to this vault's file names.
          - "knapper://personal/Target"

- name: refactor / a move leaves an external reference alone
  vault: refactor
  args: [move, Target.md, Archive/]
  expect:
    file:
      "source.md":
        contains: ["knapper://personal/Target"]

- name: refactor / a link inside a code fence is rewritten too
  vault: refactor
  args: [rename, Target, Renamed]
  # Known and deliberate for now, but not obviously right: everywhere else
  # knapper treats fenced content as not-prose, and a fenced [[Target]] is
  # excluded from the link graph. Rewriting it here is the one place that
  # rule does not hold. Pinned so that changing it is a visible edit.
  expect:
    file:
      "source.md":
        excludes: ["[[Target]]"]

- name: refactor / a folder prefix survives a rename
  vault: refactor
  args: [rename, Nested, Moved]
  expect:
    file:
      "source.md":
        contains: ["[x](Projects/Moved.md)"]

# ------------------------------------- A name with a space in it, in links --
# The forms Obsidian writes when a note's name holds a space. Each referrer
# here holds nothing but the one link, which is the point: knapper used to
# decide which files to rewrite by looking for the note's name as a substring,
# and neither `Old%20Note.md` nor a file listing only `<Old Note.md>` contains
# "Old Note". The rename went ahead, the link was left behind, and nothing
# said so.

- name: encoded / a rename follows a percent-encoded link
  vault: encoded
  args: [rename, "Old Note", "New Note"]
  expect:
    file:
      "encoded-only.md":
        contains: ["[see](New%20Note.md)"]
        excludes: ["Old%20Note.md"]

- name: encoded / a rename follows an angle-wrapped link and keeps its shape
  vault: encoded
  args: [rename, "Old Note", "New Note"]
  expect:
    file:
      "angle-only.md":
        contains: ["[see](<New Note.md>)"]
        excludes: ["<Old Note.md>"]

- name: encoded / a move follows both forms
  vault: encoded
  args: [move, "Old Note.md", "Archive/"]
  expect:
    file:
      "encoded-only.md":
        contains: ["Archive/Old%20Note.md"]
      "angle-only.md":
        contains: ["<Archive/Old Note.md>"]

- name: encoded / an angle-wrapped target reaches the graph whole
  vault: encoded
  args: [links, angle-only.md, --format, json]
  # Read with the pattern for a bare target, `<Old Note.md>` matched up to the
  # space: the graph recorded a link to `Old`, so the note lost an inbound link
  # and gained a broken one.
  expect:
    json: [{target: "Old Note", line: 3}]

- name: encoded / neither form is reported broken
  vault: encoded
  args: [broken-links, --format, json]
  expect:
    json: []

- name: encoded / a dry run names the files it would rewrite
  vault: encoded
  args: [rename, "Old Note", "New Note", --dry-run]
  expect:
    stdout_contains: ["encoded-only.md", "angle-only.md"]
    file:
      "encoded-only.md":
        contains: ["Old%20Note.md"]

- name: refactor / rename reports both paths as json
  vault: refactor
  args: [rename, Target, Renamed, --format, json]
  expect:
    stdout_contains: ["old_path", "new_path"]

- name: refactor / move relocates a note and rewrites its links
  vault: refactor
  args: [move, Target.md, Archive/]
  expect:
    file:
      "source.md":
        contains: ["Archive/Target"]

- name: refactor / a dry run writes nothing
  vault: refactor
  args: [move, Target.md, Archive/, --dry-run]
  expect:
    stdout_contains: ["DRY RUN"]
    file:
      "source.md":
        contains: ["[[Target]]"]

# ------------------------------------------------------ Moving a directory --
#
# `move` takes a directory as well as a note. The whole subtree moves, and
# every link that *resolves* into it follows -- which is a different question
# from "what mentions this name", and is why these cases keep two notes called
# README around.

- name: movedir / every link form into the directory is rewritten
  vault: movedir
  args: [move, Guide, Archive/]
  expect:
    file:
      "top.md":
        contains:
          - 'related: "[[Archive/Guide/README]]"'
          - "[[Archive/Guide/README|the guide]]"
          - "[[Archive/Guide/README#Section]]"
          - "[[Archive/Guide/README^b12]]"
          - "![[Archive/Guide/assets/diagram.png]]"
          - "[the guide](Archive/Guide/README.md)"
          - '[the guide](Archive/Guide/README.md "Guide")'
          - "[heading](Archive/Guide/README.md#a-heading)"
          - "![diagram](Archive/Guide/assets/diagram.png)"
          - "[supports:: [[Archive/Guide/README]]]"

- name: movedir / lookalikes are left alone
  vault: movedir
  args: [move, Guide, Archive/]
  expect:
    file:
      "top.md":
        contains:
          - "https://x.com/Guide/README.md"
          - "knapper://personal/Guide/README"
          - "prose: Guide/README.md is where it lives"
          - "`[[Guide/README]]`"
          - "%% [[Guide/README]] %%"
          # Unlike a single-note rename, a directory move honours the fence:
          # content that is not prose holds no links to rewrite.
          - "```\n[[Guide/README]]\n```"

- name: movedir / a bare link to a different note of the same name is untouched
  vault: movedir
  args: [move, Guide, Archive/]
  # Handbook/index.md's [[README]] is its own neighbour's, and stays a bare
  # link. top.md's [[README]] was Guide's -- Guide sorts before Handbook at
  # the same depth -- so it has to be qualified to keep pointing there now
  # that Handbook's README is the nearer one.
  expect:
    file:
      "Handbook/index.md":
        contains: ["[[README]]"]
        excludes: ["Archive"]
      "top.md":
        contains: ["bare: [[Archive/Guide/README]]"]

- name: movedir / a moved note keeps its own links working
  vault: movedir
  args: [move, Guide, Archive/]
  expect:
    file:
      # Structure is preserved, so links inside the subtree do not move.
      "Archive/Guide/README.md":
        contains:
          - "[notes](notes.md)"
          - "![diagram](assets/diagram.png)"
          # This one left the subtree, so it is one level further away now.
          - "[handbook](../../Handbook/README.md)"
      "Archive/Guide/notes.md":
        contains: ["[[README]]"]

- name: movedir / an inbound link keeps the qualification it was written with
  vault: movedir
  args: [move, Guide, Archive/]
  expect:
    file:
      "Notes/index.md":
        contains:
          - "[guide](../Archive/Guide/README.md)"
          - "[guide](Archive/Guide/README.md)"

- name: movedir / a directory dry run writes nothing
  vault: movedir
  args: [move, Guide, Archive/, --dry-run]
  expect:
    stdout_contains: ["DRY RUN", "Nothing was written."]
    file:
      "top.md":
        contains: ["[[Guide/README]]"]
      "Guide/README.md":
        contains: ["[handbook](../Handbook/README.md)"]

- name: movedir / a directory dry run reports the whole plan as json
  vault: movedir
  args: [move, Guide, Archive/, --dry-run, --format, json]
  expect:
    json_at:
      "kind": "directory"
      "old_path": "Guide"
      "new_path": "Archive/Guide"
      "dry_run": true
      "applied": false
      "blocked": false
      "entries": 3
      "notes": 2
      "unsupported_links": []
      "warnings": []
      "moves.0": {"from": "Guide/README.md", "to": "Archive/Guide/README.md"}

- name: movedir / a completed directory move reports what it did
  vault: movedir
  args: [move, Guide, Archive/, --format, json]
  expect:
    json_at:
      "kind": "directory"
      "old_path": "Guide"
      "new_path": "Archive/Guide"
      "applied": true
      "entries": 3
      "notes": 2

- name: movedir / a destination inside the source is refused
  vault: movedir
  args: [move, Guide, Guide/inner]
  expect:
    exit: 1
    stderr_contains: ["inside the source"]
    file:
      "top.md":
        contains: ["[[Guide/README]]"]

- name: movedir / moving a directory where it already is is refused
  vault: movedir
  args: [move, Guide, .]
  expect:
    exit: 1
    stderr_contains: ["already there"]

# ----------------------------------------------- Hard links and soft tags --
#
# `[[X]]` names a note and a missing one is a broken link. `#X` labels a topic
# and promises nothing. The topics fixture is the vault this distinction is
# for: `[[COO採用]]` written for years as a label. A `#tag` argument looks one
# up as a virtual subject; `demote` rewrites the exact form and nothing else.

- name: topics / a tag selector finds every note carrying it
  vault: topics
  args: [backlinks, "#COO採用", --format, json]
  # Two inline in the daily note, one nested in Hiring's frontmatter, one org
  # heading tag. Neither the excluded Archives/ note nor Code.md is an
  # occurrence: code, inline spans and %%comments%% hold no references.
  expect:
    json_length: 4
    json_contains:
      - {"source": "Daily/2026-07-01.md", "line": 10, "tag": "COO採用", "where": "inline"}
      - {"source": "Daily/2026-07-01.md", "line": 22, "tag": "COO採用", "where": "inline"}
      - {"source": "Notes/Hiring.md", "line": 3, "tag": "COO採用/面接", "where": "declared"}
      - {"source": "Notes/Log.org", "line": 4, "tag": "COO採用", "where": "declared"}
    stdout_excludes: ["Archives/Old.md", "Code.md"]

- name: topics / a tag selector answers in paths too
  vault: topics
  args: [backlinks, "#COO採用", --format, paths]
  expect:
    lines: ["Daily/2026-07-01.md", "Notes/Hiring.md", "Notes/Log.org"]

- name: topics / surrounding lines work the same way for a tag
  vault: topics
  args: [backlinks, "#COO採用", -A, "1"]
  expect:
    stdout_contains:
      - "Daily/2026-07-01.md (line 10) #COO採用"
      - "- 求人票を書いた #COO採用"
      - "- 別の話題 #work/hiring"

- name: topics / a tag covers the tags nested under it
  vault: topics
  args: [backlinks, "#work", --format, paths]
  expect:
    lines: ["Daily/2026-07-01.md", "Notes/Hiring.md", "Notes/Log.org"]

- name: topics / a nested tag does not reach back up to its parent
  vault: topics
  args: [backlinks, "#COO採用/面接", --format, json]
  expect:
    json_length: 1
    json_at: {"0.source": "Notes/Hiring.md"}

- name: topics / a tag that is not one is refused, not searched
  vault: topics
  args: [backlinks, "#8/18", --format, json]
  expect:
    exit: 1
    stderr_contains: ["Not a tag", "#8/18"]

- name: topics / context on a tag is a virtual subject, not a note
  vault: topics
  args: [context, "#COO採用", --format, json]
  expect:
    json_at:
      kind: "tag"
      tag: "COO採用"
      selector: "#COO採用"
      notes: ["Daily/2026-07-01.md", "Notes/Hiring.md", "Notes/Log.org"]
      nested_tags: ["COO採用/面接"]
      stats: {"notes": 3, "occurrences": 4}
      "occurrences.0.text": "- 求人票を書いた #COO採用"
      "tasks.0.text": "面談を設定する #COO採用"
  # A tag has no note, so it has no path and no content of its own.
    stdout_excludes: ['"path"', '"headings"']

- name: topics / context on a note is unchanged by any of this
  vault: topics
  args: [context, Notes/Hiring.md, --format, json]
  expect:
    json_at:
      path: "Notes/Hiring.md"
      title: "Hiring"
    stdout_excludes: ['"kind"']

- name: topics / a label written as a wikilink is still a broken link
  vault: topics
  args: [broken-links, --format, paths]
  sorted: true
  expect:
    lines: ["Daily/2026-07-01.md", "Daily/2026-07-02.md", "Notes/Log.org"]

- name: topics / a dry run reports the whole plan and writes nothing
  vault: topics
  args: [demote, COO採用, --dry-run]
  expect:
    stdout_contains:
      - "[DRY RUN] Demoting [[COO採用]] -> #COO採用"
      - "9: [[COO採用]] -> #COO採用"
      - "cannot be demoted (alias)"
      - "cannot be demoted (anchor)"
      - "cannot be demoted (embed)"
      - "cannot be demoted (path-qualified)"
      - "cannot be demoted (adjacent text)"
      - "cannot be demoted (org-mode)"
      - "Nothing was written."
    file:
      "Daily/2026-07-01.md":
        contains: ["- 面接の準備をした [[COO採用]]"]
      "Daily/2026-07-02.md":
        contains: ["[[COO採用]] の続き。"]

- name: topics / a dry run reports the plan as json
  vault: topics
  args: [demote, "[[COO採用]]", --dry-run, --format, json]
  expect:
    json_at:
      kind: "demote"
      target: "COO採用"
      tag: "COO採用"
      dry_run: true
      applied: false
      links_updated: 2
      files_updated: ["Daily/2026-07-01.md", "Daily/2026-07-02.md"]
      "edits.0.changes.0": {"line": 9, "before": "[[COO採用]]", "after": "#COO採用"}
      "skipped.0": {"file": "Daily/2026-07-01.md", "line": 15, "text": "[[COO採用|採用の件]]", "reason": "alias"}

- name: topics / a demote rewrites the exact form and only the exact form
  vault: topics
  args: [demote, COO採用]
  expect:
    stdout_contains: ["Done! Demoted 2 links in 2 files."]
    file:
      "Daily/2026-07-01.md":
        contains:
          - "- 面接の準備をした #COO採用"
          # Everything a tag cannot hold survives untouched.
          - "- an alias: [[COO採用|採用の件]]"
          - "- a heading: [[COO採用#面接]]"
          - "- a block: [[COO採用^b12]]"
          - "- an embed: ![[COO採用]]"
          - "- a path: [[Archives/COO採用]]"
          - "- 助詞が続く場合: [[COO採用]]の進捗"
      "Daily/2026-07-02.md":
        contains: ["#COO採用 の続き。"]
      # Code, inline spans and comments are not prose and hold no references.
      "Code.md":
        contains: ["[[COO採用]] and #COO採用", "`[[COO採用]]`", "%% [[COO採用]] and #COO採用 %%"]
      # An excluded note is not the vault's to rewrite.
      "Archives/Old.md":
        contains: ["Its [[COO採用]] and its #COO採用"]
      # knapper reads org and does not rewrite it.
      "Notes/Log.org":
        contains: ["this [[COO採用]] is"]

- name: topics / demoting a target that names a real note is refused
  vault: topics
  args: [demote, Hiring]
  expect:
    exit: 1
    stderr_contains: ["Notes/Hiring.md", "--allow-existing-note"]

- name: topics / a target nothing links to is an error rather than a no-op
  vault: topics
  args: [demote, COO採用計画]
  expect:
    exit: 1
    stderr_contains: ["No [[COO採用計画]] wikilinks found."]

- name: topics / a target that cannot be spelled as a tag says how to proceed
  vault: topics
  args: [demote, "Daily Tasks"]
  expect:
    exit: 1
    stderr_contains: ["cannot be written as a tag", "--tag Daily-Tasks"]

- name: topics / a path-qualified target is refused
  vault: topics
  args: [demote, "Archives/COO採用"]
  expect:
    exit: 1
    stderr_contains: ["Path-qualified target"]

- name: topics / tags still lists what the vault carries
  vault: topics
  args: [tags, --format, json]
  expect:
    stdout_contains: ["COO採用", "work/hiring", "COO採用/面接"]
    stdout_excludes: ["Archives"]

# ------------------------------------------------------ The reference broker --
#
# A reference names a provider; the local provider config says what runs for
# it. These cases use `printf` and `false` as providers, because knapper is
# provider-agnostic: a provider is whatever command the user configured, and
# nothing in knapper knows or cares what that command talks to.
#
# The `providers:` key on a case is the local config the run starts with,
# written outside the vault. `expect.providers` reads it back afterwards.

- name: broker / providers are listed from the local config, not the vault
  vault: bare
  providers: |
    providers:
      personal:
        command: [op, read, "op://Knapper/{locator}/value"]
  args: [provider, list]
  # Even with no knapper.config.md anywhere: the broker is not a vault
  # command, and works from any directory.
  expect:
    lines: ['personal  ["op","read","op://Knapper/{locator}/value"]']

- name: broker / an unconfigured machine lists nothing
  vault: bare
  args: [provider, list, --format, json]
  expect:
    json: []

- name: broker / set adds a provider without disturbing the others
  vault: bare
  providers: |
    providers:
      work:
        command: [work-tool, "{locator}"]
  args: [provider, set, personal, --, op, read, "op://Knapper/{locator}/value"]
  expect:
    stdout_contains: ["personal", "providers.yaml"]
    providers:
      contains: ["personal:", "work:", "op://Knapper/{locator}/value", "work-tool"]

- name: broker / a command that never reads the locator is refused
  vault: bare
  args: [provider, set, personal, --, echo, hello]
  # Without the placeholder the command answers the same thing for every
  # reference, which means the reference was never read.
  expect:
    exit: 2
    stderr_contains: ["{locator}"]
    providers:
      excludes: ["personal"]

- name: broker / a provider name outside the grammar is refused
  vault: bare
  args: [provider, set, "Personal", --, echo, "{locator}"]
  expect:
    exit: 2
    stderr_contains: ["Invalid provider name"]

- name: broker / remove forgets one provider and keeps the rest
  vault: bare
  providers: |
    providers:
      personal:
        command: [op, read, "op://Knapper/{locator}/value"]
      work:
        command: [work-tool, "{locator}"]
  args: [provider, remove, personal]
  expect:
    providers:
      contains: ["work:"]
      excludes: ["personal:"]

- name: broker / removing a provider that was never there says so
  vault: bare
  args: [provider, remove, personal]
  expect:
    exit: 3
    stderr_contains: ["No provider named"]

- name: broker / resolve prints what the provider command wrote
  vault: bare
  providers: |
    providers:
      personal:
        command: [printf, "%s\n", "value-of-{locator}"]
  args: [resolve, "knapper://personal/address.home"]
  expect:
    lines: ["value-of-address.home"]

- name: broker / every {locator} in every argument is substituted
  vault: bare
  providers: |
    providers:
      personal:
        command: [printf, "%s|%s\n", "{locator}", "a-{locator}-b"]
  args: [resolve, "knapper://personal/tokens/ci.deploy"]
  expect:
    lines: ["tokens/ci.deploy|a-tokens/ci.deploy-b"]

- name: broker / a dry run prints the argv and runs nothing
  vault: bare
  providers: |
    providers:
      personal:
        command: [false, "op://Knapper/{locator}/value"]
  # `false` would fail if it ran, so exit 0 is the proof that it did not.
  args: [resolve, "knapper://personal/address.home", --dry-run]
  expect:
    lines: ['["false","op://Knapper/address.home/value"]']

- name: broker / a reference outside the grammar never reaches a provider
  vault: bare
  providers: |
    providers:
      personal:
        command: [printf, "%s\n", "{locator}"]
  args: [resolve, "knapper://personal/../etc/passwd"]
  expect:
    exit: 2
    stderr_contains: ["knapper reference"]

- name: broker / an unknown provider is its own failure
  vault: bare
  args: [resolve, "knapper://personal/address.home"]
  expect:
    exit: 3
    stderr_contains: ["No provider named", "provider set"]

- name: broker / a provider command that fails is reported as a failure
  vault: bare
  providers: |
    providers:
      personal:
        command: [false, "{locator}"]
  args: [resolve, "knapper://personal/address.home"]
  expect:
    exit: 4
    stderr_contains: ["failed"]

- name: broker / a provider that returns nothing has not resolved anything
  vault: bare
  providers: |
    providers:
      personal:
        command: [true, "{locator}"]
  # `true` succeeds and prints nothing. An empty value is not a value: a
  # caller that took it would be acting on a secret it never received.
  args: [resolve, "knapper://personal/address.home"]
  expect:
    exit: 4
    stderr_contains: ["empty value"]

- name: broker / a timeout has to be a positive number of seconds
  vault: bare
  providers: |
    providers:
      personal:
        command: [printf, "%s\n", "{locator}"]
  args: [resolve, "knapper://personal/address.home", --timeout, "0"]
  expect:
    exit: 2
    stderr_contains: ["--timeout"]

- name: vaultproviders / a provider declared by the vault is not a provider
  vault: vaultproviders
  # knapper.config.md declares `providers: fromvault: command: [touch, ...]`.
  # It travels with the notes, so nothing in it is executable configuration:
  # resolving through it must fail the same way an empty machine does.
  # `resolve` never reads a vault, so the declaration is unreachable here
  # rather than merely refused.
  args: [resolve, "knapper://fromvault/x"]
  expect:
    exit: 3
    stderr_contains: ["No provider named"]

- name: vaultproviders / a vault command refuses the block by name
  vault: vaultproviders
  # The commands that do read knapper.config.md say what is wrong with it and
  # where executable configuration belongs, rather than skipping the block and
  # leaving the vault looking configured.
  args: [links, Note.md]
  expect:
    exit: 1
    stderr_contains:
      - "`providers` is not vault configuration"
      - "knapper providers set"
      - "knapper.config.md"

# --------------------------------------------------------- Target discovery --

- name: targets / excluded notes and leaf files are valid destinations
  vault: targets
  args: [broken-links, --format, json]
  expect:
    json: []

- name: targets / excluded notes and leaves stay out of query results
  vault: targets
  args: [query, --format, paths]
