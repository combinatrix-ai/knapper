name: Release

on:
  release:
    types: [published]

# Builds a static-ish binary per platform and attaches it to the release.
# The point of the Rust implementation is that installing knapper should not
# require a Python interpreter, so the artefacts have to exist before that
# claim means anything.

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            # musl so the binary runs on Alpine and in a scratch container,
            # which is the headless case knapper exists for.
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="knapper-${{ github.event.release.tag_name }}-${{ matrix.target }}"
          # The archive is named for the tag, but the directory inside it is
          # always plain `knapper/`. `knapper self-update` reads the binary
          # out of that fixed path, so it must not carry the version.
          mkdir -p dist/knapper
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/knapper.exe" dist/knapper/
          else
            cp "target/${{ matrix.target }}/release/knapper" dist/knapper/
          fi
          cp README.md LICENSE dist/knapper/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" knapper
          else
            tar czf "$name.tar.gz" knapper
          fi

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" --pattern '*' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish one checksum file
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release upload "${{ github.event.release.tag_name }}" SHA256SUMS \
            --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
