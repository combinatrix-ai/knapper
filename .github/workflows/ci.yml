name: CI

on:
  push:
    branches: [main, "codex/release-*", "feat/dataview-dql"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust / knapper
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than "stable": clippy gains lints with every release, so
      # -D warnings on a floating toolchain fails builds for reasons unrelated
      # to the commit under test, and on a lint the author could not have run.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dql/package.json

      - name: Rebuild pinned Dataview bundle and verify notices
        run: |
          pnpm --dir dql install --frozen-lockfile --ignore-scripts
          pnpm --dir dql build
          git diff --exit-code -- dql/engine.js dql/upstream-tests.js dql/upstream-index.ts dql/THIRD_PARTY_NOTICES.txt

      - name: Rebuild pinned community plugin bundles and notices
        run: |
          npm ci --prefix plugins --ignore-scripts --no-audit --no-fund
          npm run build --prefix plugins
          npm test --prefix plugins
          git diff --exit-code -- plugins/tasks-engine.js plugins/linter-engine.js plugins/quickadd-engine.js plugins/upstream-tests.js plugins/THIRD_PARTY_NOTICES.txt

      - name: Unmodified upstream Jest suites
        run: pnpm --dir dql test

      - name: Format
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests cover the parser, org reader, vault scan, templater, tasks
      # and query. The contract suite drives the built binary against fixture
      # vaults, which is what the CLI actually promises callers.
      - name: Test
        run: cargo test

      - name: Synthetic PKM case registry
        run: |
          python3 scripts/verify-pkm-vault.py --knapper "$PWD/target/debug/knapper" --vault "$PWD/tests/fixtures/pkm" --output "$RUNNER_TEMP/pkm-baseline.json"

      - name: Compare embedded DQL with Node native Intl
        env:
          KNAPPER_DQL_NODE: node
        run: cargo test node_reference_matches_embedded_runtime -- --ignored

      - name: Build release binaries
        run: cargo build --release --bin knapper
