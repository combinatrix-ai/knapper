name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust / knapper
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than "stable": clippy gains lints with every release, so
      # -D warnings on a floating toolchain fails builds for reasons unrelated
      # to the commit under test, and on a lint the author could not have run.
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests cover the parser, org reader, vault scan, templater, tasks
      # and query. The contract suite drives the built binary against fixture
      # vaults, which is what the CLI actually promises callers.
      - name: Test
        run: cargo test

      - name: Build release binaries
        run: cargo build --release --bin knapper --bin knapper-chrome-host --bin knapper-chrome-client

  chrome-extension:
    name: Chrome extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          check-latest: false

      - name: Check JavaScript
        run: |
          node --check integration/chrome/service_worker.js
          node --check integration/chrome/content_script.js
          node --check integration/chrome/popup.js
          node --check integration/chrome/e2e/live_bridge_test.mjs

      - name: Test Chrome extension
        run: |
          node --test integration/chrome/service_worker.test.mjs
          node --test integration/chrome/e2e/live_bridge_test.test.mjs

      - name: Validate manifests
        run: |
          node -e 'for (const path of process.argv.slice(1)) JSON.parse(require("node:fs").readFileSync(path, "utf8"));' \
            integration/chrome/manifest.json \
            integration/chrome/native-host-manifest.example.json

      - name: Package Chrome extension
        run: integration/chrome/package-extension.sh dist/knapper-chrome-extension.zip

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: knapper-chrome-extension
          path: dist/knapper-chrome-extension.zip
          if-no-files-found: error
