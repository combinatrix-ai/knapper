name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than "stable": clippy gains lints with every release, so
      # -D warnings on a floating toolchain fails builds for reasons unrelated
      # to the commit under test, and on a lint the author could not have run.
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests cover the parser, org reader, vault scan, templater, tasks
      # and query. The contract suite drives the built binary against fixture
      # vaults, which is what the CLI actually promises callers.
      - name: Test
        run: cargo test

      - name: Check Chrome extension
        run: |
          node --check integration/chrome/service_worker.js
          node --check integration/chrome/content_script.js
          node --check integration/chrome/e2e/live_bridge_test.mjs
          node --test integration/chrome/service_worker.test.mjs
          node --test integration/chrome/e2e/live_bridge_test.test.mjs
          python3 -m json.tool integration/chrome/manifest.json >/dev/null
          python3 -m json.tool integration/chrome/native-host-manifest.example.json >/dev/null

      - name: Build the release binary
        run: cargo build --release
